<title>トップライバーへの道｜昭和風ドットRPG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 縦1列・幅上限480。濃紺の文字窓と生成りの二重枠（第21F・21K節）。単一の夜色テーマで統一 */
:root{
  --dockH:104px;
  --ink:#101820; --navy:#23364D; --slate:#455A68; --mist:#8B9BA0; --cream:#F4ECD8; --sand:#D4B483;
  --red:#B84B4B; --coral:#E88470; --gold:#D5B34C; --leaf:#5F7D4E; --sea:#4D8491; --aqua:#83B9AE; --violet:#6E608A;
  --f-dot:"DotGothic16","BIZ UDPGothic",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--f-body);font-size:18px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
#screen{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.label{font-family:var(--f-dot);font-weight:400;letter-spacing:.06em;color:var(--gold);font-size:18px}
h3.label{font-size:16px;margin-top:8px}
.small{font-size:15px;color:#D9D2C0}
.dim{color:var(--mist)}
.warn{color:var(--coral)}
.good{color:var(--aqua)}
.win{background:var(--navy);border:3px double var(--cream);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{font:inherit;font-size:17px;min-height:48px;padding:8px 12px;background:var(--ink);color:var(--cream);border:2px solid var(--mist);border-radius:2px;cursor:pointer;text-align:left;touch-action:manipulation}
.btn:hover{border-color:var(--cream)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--red);border-color:var(--cream);font-weight:700}
.btn.on{border-color:var(--gold);background:#2E2A22}
.btn.sq{min-width:48px;text-align:center;padding:0}
.btn.wide{width:100%;text-align:center}
.stack{display:flex;flex-direction:column;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}
.srow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{font-size:14px;border:1px solid var(--mist);padding:0 6px;font-family:var(--f-dot)}
.tag.danger{border-color:var(--coral);color:var(--coral)}
.tag.safe{border-color:var(--aqua);color:var(--aqua)}
.status{background:var(--ink);border:3px double var(--mist);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.status .place{font-family:var(--f-dot);color:var(--gold)}
.goal{font-size:16px}
/* タイトル */
.title-screen{display:flex;flex-direction:column;gap:14px;align-items:stretch}
#titleArt{width:100%;max-width:480px;image-rendering:pixelated;border:3px double var(--cream)}
.logo{display:flex;flex-direction:column;font-family:var(--f-dot);font-weight:400;line-height:1.25}
.logo .main{font-size:clamp(24px,7.6vw,40px);white-space:nowrap;color:var(--cream);letter-spacing:.04em;text-shadow:3px 3px 0 var(--red)}

.lead{font-size:18px}
.menu{display:flex;flex-direction:column;gap:8px}
.note{font-size:15px;color:var(--mist)}
/* 主人公設定 */
.input{font:inherit;font-size:20px;min-height:48px;background:var(--ink);color:var(--cream);border:2px solid var(--mist);padding:6px 10px;width:100%;box-sizing:border-box}

/* 探索 */

body.in-explore{padding-top:6px;padding-bottom:calc(var(--dockH) + 6px + env(safe-area-inset-bottom,0px));margin:0}
.explore{display:flex;flex-direction:column;gap:6px;height:calc(100dvh - 12px - var(--dockH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}

.here{font-size:14px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}

.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none}
.menu-grid .btn{text-align:center;font-family:var(--f-dot);min-height:44px;padding:2px 0;font-size:clamp(12px,3.4vw,14px);letter-spacing:-.06em;white-space:nowrap;overflow:hidden}
/* 会話・シート */
.overlay{position:fixed;inset:0;background:rgba(16,24,32,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;max-height:calc(100% - 24px);overflow-y:auto;box-sizing:border-box}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--navy);padding-block:4px;z-index:1}
.dlg{width:100%;max-width:480px;box-sizing:border-box}
.speaker{font-family:var(--f-dot);color:var(--gold)}
.dlg-text{font-size:19px;min-height:3.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);border:2px solid var(--gold);padding:8px 14px;z-index:40;max-width:90%;font-size:16px}
.qcard,.jcard{border:2px solid var(--slate);padding:10px;display:flex;flex-direction:column;gap:6px}
.qcard.complete{opacity:.7}
.jcard.on{border-color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:6px}
.btn.opt{font-size:16px}
.dexrow{display:flex;flex-direction:column;gap:2px}
.who{display:flex;gap:12px;align-items:center}
.prow{display:flex;gap:6px}.grow{flex:1;min-width:0}
.qty{text-align:center;font-family:var(--f-dot)}
/* 戦闘：1画面に収める（縦スクロールなし）。上から 状態→敵→味方→コマンド→ログ */
body.in-battle{padding-top:6px;padding-bottom:calc(var(--dockH) + 6px + env(safe-area-inset-bottom,0px));margin:0}
.battle{display:flex;flex-direction:column;gap:6px;height:calc(100dvh - 12px - var(--dockH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));font-size:15px;line-height:1.35;overflow:hidden}
@supports not (height:100dvh){.battle{height:calc(100vh - 12px - var(--dockH))}}
.bhead{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-dot);color:var(--gold);font-size:14px;flex-wrap:wrap}
.gauge{display:grid;grid-template-columns:auto 1fr 2.2em;gap:6px;align-items:center;font-size:14px}
.gauge b{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:block;height:7px;background:var(--ink);border:1px solid var(--mist);overflow:hidden}
.bar i{display:block;height:100%;background:var(--aqua)}
.bar.enemy i{background:var(--coral)}
.bar.ale{height:12px}.bar.ale i{background:var(--gold)}
.cue{border:1px dashed var(--mist);padding:2px 6px;font-size:13px;color:#D9D2C0}
.cue.on{border:2px solid var(--gold);color:var(--gold);font-size:14px}
.enemies{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;flex:none}
.enemies{position:relative;padding:2px;overflow:hidden}
.stagebg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:0}
.ecard{position:relative;z-index:1;background:rgba(16,24,32,.42);text-shadow:1px 1px 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink),2px 2px 0 var(--ink);border:2px solid var(--slate);padding:4px 6px;display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;min-width:0}
.einfo{display:contents}
.ecard .esprite{grid-row:1}.ecard .ename{grid-row:1;grid-column:2}
.ecard .bar,.ecard .estat,.ecard .tele{grid-column:1 / -1}
.ecard.isboss{grid-template-columns:auto 1fr}.ecard.isboss .esprite{grid-row:1 / span 4}.ecard.isboss .bar,.ecard.isboss .estat,.ecard.isboss .tele{grid-column:2}
.ecard.down{opacity:.4}
.esprite{width:40px;height:40px;image-rendering:pixelated}
.esprite.boss{width:clamp(72px,22vw,104px);height:auto;aspect-ratio:1}
.ename{font-size:15px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.rar{font-size:12px;color:var(--gold);font-weight:400}
.estat{font-size:13px;font-variant-numeric:tabular-nums}
.tele{font-size:14px;color:var(--coral);font-weight:700}
.hitfx{animation:hit .3s steps(3)}
@keyframes hit{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:none}}
.party{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:none}
.pcard{position:relative;font:inherit;color:var(--cream);background:var(--ink);border:2px solid var(--slate);padding:3px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:48px;cursor:pointer;min-width:0;line-height:1.25}
.pcard.on{border-color:var(--gold);background:#2E2A22}
.pcard.done{opacity:.6}.pcard.ko{opacity:.4}
.pline{display:flex;gap:0 4px;align-items:baseline;min-width:0;font-size:14px}
.pline b{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pline .pst{flex:none;white-space:nowrap}
.pjob{font-size:12px;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pst{font-size:12px;border:1px solid var(--mist);padding:0 3px;flex:none}
.pstat{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.pbadges{display:flex;gap:3px;flex-wrap:wrap}.pstat b{font-weight:700;color:var(--cream)}
.win.cmd{padding:6px;gap:6px;flex:1 1 auto;min-height:0;overflow:hidden;border-width:3px;display:flex;flex-direction:column}
.cmd .cmdgrid,.cmd .confirmrow{flex:none}
.cmd .cmdgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cmd .cmdgrid .btn{font-size:13px;min-height:44px;padding:2px 2px;text-align:center;line-height:1.15;letter-spacing:-.03em}
.chipbreak{flex-basis:100%;height:0}
.sw{display:none}
@media (max-width:340px){.lw{display:none}.sw{display:inline}}
.chips{display:flex;flex-wrap:wrap;gap:4px;flex:0 1 auto;min-height:0;overflow-y:auto;align-content:flex-start}
.chip{font:inherit;font-size:14px;min-height:40px;padding:2px 10px;background:var(--ink);color:var(--cream);border:2px solid var(--mist);border-radius:2px;cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:left}
.chiplabel{align-self:center;font-size:12px;color:var(--sand);margin-left:4px}
.chip.on{border-color:var(--gold);background:#2E2A22}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.confirmrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-top:auto}
.confirmrow .btn{min-height:48px;min-width:88px;text-align:center}
.preview{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.3;min-width:0}
.preview .pinfo{color:#D9D2C0}.preview .pv{color:var(--aqua);font-size:14px}.preview .hint{color:var(--mist)}.preview .warn{font-size:14px}
.cmd p{font-size:15px}
.log{font:inherit;text-align:left;color:var(--cream);font-size:13px;line-height:1.3;background:var(--ink);border:2px solid var(--slate);padding:4px 6px;display:flex;flex-direction:column;gap:1px;flex:none;cursor:pointer;min-height:48px}
.log span{overflow-wrap:anywhere}
@media (max-height:600px){.explore{height:auto;overflow:visible}.mapwrap{flex:none;height:200px}.battle{height:auto;overflow:visible}.win.cmd{overflow:visible}.chips{overflow:visible}}
@media (max-height:700px){.cue,.cue.on{font-size:12px}.bhead{font-size:12px}.pstat{font-size:12px}.pjob{display:none}.esprite.boss{width:60px}.bhead{font-size:13px}.ename{font-size:14px}.esprite{width:32px;height:32px}.pcard{min-height:44px}.cmd .cmdgrid .btn{min-height:40px}.chip{min-height:36px}.log span:first-child:nth-last-child(3){display:none}}
.pop{position:absolute;right:8px;top:2px;font-family:var(--f-dot);font-size:20px;font-weight:700;pointer-events:none;animation:popup .9s steps(6) forwards;text-shadow:2px 2px 0 var(--ink);z-index:3}
.pop.dmg{color:var(--cream)}.pop.hurt{color:var(--coral)}.pop.heal{color:var(--aqua)}
@keyframes popup{0%{transform:translateY(6px);opacity:1}70%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.shake{animation:shake .3s steps(3)}
@keyframes shake{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}}
.pstrip{position:relative;font:inherit;color:var(--cream);background:var(--ink);border:2px solid var(--slate);padding:3px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;text-align:left;cursor:pointer;min-height:48px;flex:none}
.pstop{grid-column:1 / -1;display:flex;justify-content:space-between;gap:6px;font-size:12px;color:#D9D2C0}
.pstrip:hover{border-color:var(--cream)}
.pmini{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:14px}
.pmline{display:flex;flex-direction:column;gap:0;min-width:0;line-height:1.3}
.pmline b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.pmline .small{white-space:nowrap;font-size:12px}
.pmini.ko{opacity:.5}
.pmini .small{font-size:13px;font-variant-numeric:tabular-nums}
.pmore{font-size:12px;color:var(--gold);font-family:var(--f-dot);flex:none}
.scard{border:2px solid var(--slate);padding:10px;display:flex;flex-direction:column;gap:8px}
.scard.ko{border-color:var(--red)}
.sname{font-size:18px}
.scard .kv dd{font-variant-numeric:tabular-nums}
.bar.wide{height:8px;margin-bottom:2px}
/* ジョイコントローラー（画面下に固定） */
body.no-dock{--dockH:0px}
body.no-dock .dock{display:none}
body{padding-bottom:calc(var(--dockH) + 12px)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--dockH);box-sizing:content-box;padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));background:var(--ink);border-top:3px double var(--mist);display:flex;align-items:center;justify-content:space-between;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.dock>*{max-width:480px}
.stick{position:relative;width:92px;height:92px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--slate) 0 38%,var(--navy) 39% 100%);border:3px solid var(--cream);box-shadow:inset 0 0 0 3px var(--ink);touch-action:none;cursor:pointer}

function buildMap(w,h,ops){
  const g=[]; for(let y=0;y<h;y++){g.push(new Array(w).fill("T"));}
  for(const [t,x,y,ww,hh] of ops){ for(let j=y;j<y+hh;j++) for(let i=x;i<x+ww;i++) if(g[j]&&i>=0&&i<w) g[j][i]=t; }
  return g;
}

const SLOT_ORDER={w:0,a:1,acc:2};
function sortEq(ids){ const m=G.eqSort||"type"; const P=id=>eqPower(EQUIP[id]);
  const jo=id=>EQUIP[id].job?1+JOB_IDS.indexOf(EQUIP[id].job):0;
  return ids.slice().sort((x,y)=>{ const a=EQUIP[x],b=EQUIP[y];
    if(m==="power") return P(y)-P(x);
    if(m==="price") return (b.price||0)-(a.price||0) || P(y)-P(x);
    if(m==="job") return jo(x)-jo(y) || SLOT_ORDER[a.slot]-SLOT_ORDER[b.slot] || P(y)-P(x);
    return SLOT_ORDER[a.slot]-SLOT_ORDER[b.slot] || P(y)-P(x); }); }
function eqSortBar(){ const m=G.eqSort||"type"; return `<div class="sortbar"><span class="small">並び替え</span>${[["type","種別"],["job","職業"],["power","強さ"],["price","価格"]].map(([v,l])=>`<button class="chip ${m===v?"on":""}" data-a="eqSort" data-v="${v}">${l}</button>`).join("")}</div>`; }
const ITEM_KIND_ORDER={"回復道具":0,"蘇生道具":1,"攻撃道具":2};
function sortItems(list){ const m=G.itSort||"type"; return list.slice().sort((x,y)=>{ const a=ITEMS[x.id||x],b=ITEMS[y.id||y];
  if(m==="stars") return b.stars-a.stars || a.tier-b.tier;
  if(m==="count") return (y.n||0)-(x.n||0);
  return ITEM_KIND_ORDER[itemKind(a)]-ITEM_KIND_ORDER[itemKind(b)] || a.cat.localeCompare(b.cat) || a.tier-b.tier; }); }
function itSortBar(withCount){ const m=G.itSort||"type"; return `<div class="sortbar"><span class="small">並び替え</span>${[["type","種別"],["stars","レア度"],...(withCount?[["count","所持数"]]:[])].map(([v,l])=>`<button class="chip ${m===v?"on":""}" data-a="itSort" data-v="${v}">${l}</button>`).join("")}</div>`; }
function canEquipC(st,c,it){return !!it&&characterLevel(st,c)>=(it.needL||1)&&(!it.job||(st.jobs[c]===it.job&&jobRank(st,c,it.job)>=it.needR));}
function equipRequirement(it){return it.job?[(it.needL>1?'個人Lv'+it.needL+'以上':''),JOBS[it.job].name+'専用・熟練度'+it.needR+'以上'].filter(Boolean).join('／'):'個人Lv'+(it.needL||1)+'以上';}

function bestGainText(st,id,L){ const it=EQUIP[id]; let best=null;
  for(const c of st.roster){ if(!canEquipC(st,c,it)) continue; const cur=charStats(st,c,L), nx=charStats(st,c,L,null,{...st.equip[c],[it.slot]:id});
    const a=statRows(cur,L), b=statRows(nx,L);
    for(let i=0;i<a.length;i++){ if(typeof a[i][1]!=="number") continue; const d=round1(b[i][1]-a[i][1]); if(d>0&&(!best||i<best.i||(i===best.i&&d>best.d))) best={d,k:a[i][0],c,i}; } }
  return best?`最大で${best.k}▲＋${best.d}（${charName(st,best.c)}）`:"今の装備より上がる人なし"; }

      ...STAT_KEYS.map(k=>[STAT_NAMES[k]+(k===sig?"★":""),a.base[k],b.base[k],k===sig?"sig":""])];

function mainQuestOf(hub){ return Object.keys(QUESTS).find(k=>QUESTS[k].main&&QUESTS[k].hub===hub); }
function hubRequirement(hub){const national=nationalEntry(hub);if(national)return national.prior;const c=NEXT_CHAPTER.find(c=>c.id===hub);if(c)return c.index?NEXT_CHAPTER[c.index-1].qid:'M16';if(hub==='KY17')return 'M16';const i=HUB_ORDER.indexOf(hub);return i>0?mainQuestOf(HUB_ORDER[i-1]):null;}
function hubUnlocked(st,hub){if(!HUB_ORDER.includes(hub)||hub.startsWith('NX')&&st.quests.M16!=='complete')return false;const q=hubRequirement(hub);return !q||st.quests[q]==='complete';}
function fixQuestChain(st){
  for(const id of Object.keys(QUESTS)) if(!st.quests[id]) st.quests[id]="locked";
  for(const hub of HUB_ORDER){const b=mainQuestOf(hub);if(b&&hubUnlocked(st,hub)&&st.quests[b]==='locked')st.quests[b]='available';}
  st.shikokuChugokuClear=st.quests.C09==='complete';st.nationalClear=st.quests.N607==='complete';
  for(const id of Object.keys(QUESTS)){ const Q=QUESTS[id]; if(Q.main&&st.quests[id]==="complete"&&Q.rank!=null) st.moeRank=Math.max(st.moeRank||0,Q.rank); }
}

function progressionCap(st){let n=0;for(const c of PROGRESSION_CHAPTERS){if(!chapterUnlocked(st,c))break;n++;}return chapterLimit(n);}

 const table=[0,0];for(let n=1;n<999;n++){const percent=Math.min(capPercent,startPercent+stepPercent*(n-1));table[n+1]=table[n]+Math.ceil((previous(n+1)-previous(n))*percent/100);}return Object.freeze(table);

 if(cid==='hero'){st.profile.name=v.value;delete st.names[cid];}
 else if(cid==='moe'){st.profile.heroine={...heroineOf(st),name:v.value};delete st.names[cid];}
 else st.names[cid]=v.value;
 return {ok:true};
}
function companionText(text,st){
 if(!st||typeof text!=='string')return text;
 const pairs=Object.entries(st.names||{}).filter(([c,n])=>CHARS[c]&&c!=='hero'&&c!=='moe'&&n!==CHARS[c].name);
 if(!pairs.length)return text;
 const keep=[];let t=text;const token=w=>{keep.push(w);return '\u0003'+(keep.length-1)+'\u0004';};
 const protectedNames=[...st.roster.map(c=>charName(st,c))].sort((a,b)=>b.length-a.length);
 for(const n of new Set(protectedNames))t=t.split(n).join(token(n));
 const replacements=pairs.flatMap(([c,n])=>[[CHARS[c].full,n],[CHARS[c].name,n]]).sort((a,b)=>b[0].length-a[0].length);
 for(const [old,n]of replacements)t=t.split(old).join(token(n));
 return t.replace(/\u0003(\d+)\u0004/g,(m,i)=>keep[+i]);
}
function openPendingName(){const st=G.st;if(!st||G.readOnly||st.run||st.stream||G.dlg)return;const cid=(st.pendingNames||[]).find(c=>st.roster.includes(c));if(cid)openSheet('rename',{cid,joining:true});}
function finishRename(){
 if(!G.st||G.readOnly)return;const d=G.sheetData||{};
 G.st.pendingNames=(G.st.pendingNames||[]).filter(c=>c!==d.cid);commit();backSheet(d.back||null);if(!G.sheet)openPendingName();
}
function renderRename(){const st=G.st,d=G.sheetData,cid=d.cid;if(!st.roster.includes(cid))return '<p>仲間が見つかりません。</p>';
 return `<p>${d.joining?'新しい仲間が加入しました。名前を変更できます。':'名前は何度でも変更できます。'}</p><p>現在の名前：<b>${esc(charName(st,cid))}</b></p><label for="renameInput">新しい名前（全角${NAME_MAX}文字以内）</label><input class="input" id="renameInput" value="${esc(charName(st,cid))}" autocomplete="off" enterkeyhint="done"><p class="small">ひらがな・カタカナ・漢字・全角英数字。空白・記号は使用できません。名前を変えても装備や物語の進行は引き継ぎます。</p><div class="stack"><button class="btn primary" data-a="renameSave">この名前にする</button>${cid!=='hero'&&cid!=='moe'?`<button class="btn" data-a="renameDefault">元の名前「${esc(CHARS[cid].name)}」に戻す</button>`:''}<button class="btn" data-a="closeSheet">${d.joining?'今の名前で進む':'変更せず戻る'}</button></div>`;
}

function newGame(name, gender, heroine, career){
  const st = {
    schemaVersion:SCHEMA_VERSION, saveEpoch:SAVE_EPOCH, gameVersion:GAME_VERSION, saveGeneration:0, partyRulesVersion:2, xpCurveVersion:3, jpCurveVersion:2,
    profile:{name, gender, career:career||"社会福祉士", heroine:{name:(heroine&&heroine.name)||HEROINE_DEFAULT.name, gender:(heroine&&heroine.gender)||"女性"}}, day:1, jobEvents:{},jobEvent:null, mapId:"KY01", pos:{x:19,y:19}, dir:0,
    visitedMaps:["KY01"], visitedHubs:["KY01"], xp:0,
    names:{},pendingNames:[],roster:["hero","moe"], party:["hero","moe"], vitals:null,
    jobs:{}, jp:{}, equip:{}, owned:{CW01:8, CA01:8}, favorite:{},
    challenges:{},festivals:{},townBattles:{},gold:0, tickets:200, gifts:{W:{},A:{}},
    bag:INITIAL_ITEMS.map(([id,n])=>({id,n})), keep:[], itemsVersion:1,
    quests:{M01:"available", M02:"locked", S01:"locked", S02:"locked"}, qprog:{}, activeQuest:null,
    talked:{}, boxes:{}, cards:[], bossDefeated:{}, seen:{}, killCount:{},
    moeRank:0, run:null, runSeq:0, stream:null, lastResult:null, streamBest:{},
    support:null, scenes:{}, fukuokaClear:false,
    settings:{difficulty:"std", sound:true, soundV:2, reduceMotion:false, follow:false}
  };
  for(const c of CHAR_ORDER){
    st.jobs[c]=CHARS[c].initJob; st.jp[c]={};
    st.equip[c]={w:null,a:null,acc:null};
  }
  for(const c of st.roster){ st.equip[c].w="CW01"; st.equip[c].a="CA01"; }
  // 主人公は職歴に合わせた初期装備（非売品・各1個）を装備して始める
  const cg=CAREER_GEAR_ID[st.profile.career]; if(cg){ st.owned[cg[0]]=1; st.owned[cg[1]]=1; st.equip.hero.w=cg[0]; st.equip.hero.a=cg[1]; }
  ensureCharacterStories(st);
  ensureNarrative(st);
  fixQuestChain(st);
  ensureWorld(st);syncCollection(st);
  return st;
}

function worldAtlasBounds(region){if(region==='all')return {x:0,y:0,w:WORLD_GEO.w,h:WORLD_GEO.h};if(region==='near'){const p=G.st.mapId==='WORLD'?G.st.pos:WORLD_NODES[curHub()];return {x:Math.max(0,p.x-44),y:Math.max(0,p.y-36),w:88,h:72};}const nodes=HUB_ORDER.filter(id=>worldAtlasRegionHub(id,region)).map(id=>WORLD_NODES[id]),x=Math.min(...nodes.map(n=>n.x))-24,y=Math.min(...nodes.map(n=>n.y))-28;return {x,y,w:Math.max(70,Math.max(...nodes.map(n=>n.x))-x+24),h:Math.max(65,Math.max(...nodes.map(n=>n.y))-y+28)};}
function renderNationalAtlas(){
 const st=G.st,region=Object.hasOwn(WORLD_ATLAS_REGIONS,G.sheetData.atlasRegion)?G.sheetData.atlasRegion:'all',b=worldAtlasBounds(region),m=MAPS.WORLD,stroke=region==='all'?.85:1.1,font=region==='all'?7:3.2;
 const layer=['walk','rail','highway','all'].includes(G.sheetData.atlasLayer)?G.sheetData.atlasLayer:'walk';
 const transportLines=m.transportNetworks.filter(n=>layer==='all'||layer===n.type).map(n=>'<polyline data-layer="'+n.type+'" points="'+n.path.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="'+(n.type==='rail'?'#d6ebe0':'#91a9c6')+'" stroke-width="'+(n.type==='rail'?1:1.8)+'" '+(n.type==='rail'?'stroke-dasharray="3 1"':'')+'/>').join('');
 const poly=m.coasts.map(c=>'<polygon points="'+c.points.map(p=>p.x+','+p.y).join(' ')+'" fill="#647f60" stroke="#a7b991" stroke-width=".65"><title>'+esc(c.name)+'</title></polygon>').join('');
 const rivers=m.rivers.map(r=>'<polyline points="'+r.points.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="#79bacb" stroke-width="1.6"><title>'+esc(r.name)+'</title></polyline>').join('');

 const major=['KY01','KY15','NX09','KT04','KT09','HK06','TH02','TH07','KN07','RS06'];
 const nodes=HUB_ORDER.map(id=>{const n=WORLD_NODES[id],open=hubUnlocked(st,id),here=curHub()===id,show=region!=='all'||major.includes(id);return '<g><title>'+esc(HUBS[id].name)+'／'+(open?'解放済み':'未開放エリア')+'</title><line x1="'+n.geoX+'" y1="'+n.geoY+'" x2="'+n.x+'" y2="'+n.y+'" stroke="#cad0b5" stroke-width=".4"/><circle cx="'+n.x+'" cy="'+n.y+'" r="'+(here?2.7:1.6)+'" fill="'+(here?'#fff0ac':open?'#e0cc94':'#52606b')+'"/>'+(show?'<text x="'+n.x+'" y="'+(n.y-4)+'" text-anchor="middle" dominant-baseline="middle" font-size="'+font+'" fill="'+(open?'#fff2d2':'#a8b1b7')+'">'+esc(region==='all'?HUBS[id].name:worldPrefectureName(id)+'・'+HUBS[id].name)+'</text>':'')+'</g>';}).join('');
 const spots=m.landmarks.map(o=>'<g><title>'+esc(o.name)+'</title><path d="M'+o.geoX+' '+(o.geoY-2)+' l2 3 -4 0 z" fill="#e4a77b"/>'+(region!=='all'?'<text x="'+o.geoX+'" y="'+(o.geoY-4)+'" text-anchor="middle" dominant-baseline="middle" font-size="2.6" fill="#ffcf9b">'+esc(o.name)+'</text>':'')+'</g>').join('');
 return '<label class="atlas-region">表示地域<select id="worldAtlasRegion">'+Object.entries(WORLD_ATLAS_REGIONS).map(([k,v])=>'<option value="'+k+'" '+(region===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="atlas-region">道・交通表示<select id="worldAtlasLayer">'+[['walk','街道・徒歩ルート'],['rail','線路・駅'],['highway','高速道路'],['all','すべて重ねる']].map(([k,v])=>'<option value="'+k+'" '+(layer===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><div class="national-atlas japan-atlas"><svg viewBox="'+[b.x,b.y,b.w,b.h].join(' ')+'" role="img" aria-label="日本列島の全国街道の接続図。暗い街は未開放。"><rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" fill="#173d53"/>'+poly+rivers+transportLines+((layer==='walk'||layer==='all')?roads:'')+spots+nodes+'<text x="'+(b.x+5)+'" y="'+(b.y+9)+'" fill="#e5e7cd" font-size="'+font+'">N ↑　'+WORLD_ATLAS_REGIONS[region]+'</text></svg></div><p class="small">街の緯度経度を参考にした日本列島マップ。密集地は入口記号をずらし、細線で投影位置を結びます。金色＝街道／水色の破線＝港を結ぶ航路／暗色＝未開放。地形・交通経路はゲーム向けの概略です。</p><details class="terrain-legend"><summary>地形・交通・名所の見方</summary><div class="terrain-grid">'+Object.entries(WORLD_TERRAIN).map(([k,v])=>'<span><i style="background:'+v[1]+'"></i>'+v[0]+'</span>').join('')+'</div><p>未開放エリアと海・川のマスには入れません。開放済みの森林・山・雪山・線路・高速道路などの陸地を移動できます。水上は橋・港・浮標のある航路を使います。砂漠は鳥取砂丘の周辺に加えた創作の景観です。</p><p><a href="https://maps.gsi.go.jp/" target="_blank" rel="noopener noreferrer">位置の参考：国土地理院 地理院地図</a></p><div class="stack">'+m.landmarks.map(o=>'<a href="'+o.source+'" target="_blank" rel="noopener noreferrer">'+esc(o.name)+'の公式案内</a>').join('')+'</div></details>';
}


function ensureWorld(st){
  if(!st)return;
  if(!Number.isInteger(st.worldSeed))st.worldSeed=(Math.floor(Math.random()*4294967295)>>>0);
  const changed=activeWorldSeed!==st.worldSeed||st.worldLayoutVersion!==3;
  if(changed){for(const id of HUB_ORDER)MAPS[id]=separateCityMap(generateTown(id,st.worldSeed));activeWorldSeed=st.worldSeed;}
  const repair=(p,id)=>{const m=MAPS[id];if(!m||m.kind!=='out'||m.mapScope==='world'||!p)return;const same=p.x===m.safeAnchor[0]&&p.y===m.safeAnchor[1];if(!walkable(m,p.x,p.y)||(changed&&zoneAt(m,p.x,p.y))||(changed&&!same&&!bfs(m,m.safeAnchor[0],m.safeAnchor[1],(x,y)=>x===p.x&&y===p.y))){p.x=m.safeAnchor[0];p.y=m.safeAnchor[1];}};
  repair(st.pos,st.mapId);if(st.run&&st.run.returnPos)repair(st.run.returnPos,st.run.returnPos.map);st.worldLayoutVersion=3;migrateNationalLocation(st);
}

/* ---- v5.33 能力値（ユーザー指定）：体力・ちから・身の守り・すばやさ・魅力。職業ごとに初期値と伸び方が違う ----
   ◎=1.25倍 ○=1.0倍 △=0.8倍（標準の初期値・1レベルあたりの伸びに掛ける）
   体力→最大HP／ちから→攻撃力／身の守り→防御力／すばやさ→会心率・回避率／魅力→得るエールと技能の回復量 */
const STAT_KEYS = ["vit","str","def","agi","cha"];
const STAT_NAMES = {vit:"体力", str:"ちから", def:"身の守り", agi:"すばやさ", cha:"魅力"};
const STAT_STD = {vit:[25,3.0], str:[12,2.0], def:[4,1.0], agi:[8,1.5], cha:[8,1.5]};
const GRADE = {"◎":1.4, "○":1.0, "△":0.72};
/* 職業ごとの「看板能力」：レベルアップでさらに1.2倍伸びる（成長の特色） */
const JOB_SIG = {J01:"vit",J02:"agi",J03:"cha",J04:"def",J05:"agi",J06:"str",J07:"def",J08:"cha",J09:"def",J10:"cha",J11:"cha",J12:"vit",J13:"cha",J14:"vit",J15:"str",J16:"def",J17:"def",J18:"cha",J19:"agi",J20:"agi",J21:"str",J22:"cha"};
function growthLabel(job){ const g=[...(JOB_STAT_GRADES[job]||"○○○○○")]; const hi=STAT_KEYS.filter((k,i)=>g[i]==="◎"&&k!==JOB_SIG[job]).map(k=>STAT_NAMES[k]); return `${STAT_NAMES[JOB_SIG[job]]||"体力"}★`+(hi.length?`・${hi.join("・")}◎`:""); }
const JOB_STAT_GRADES = { // 体力 ちから 身の守り すばやさ 魅力
  // v5.35：どの職業も伸びの総量（◎1.25・○1・△0.8の合計）が5.0〜5.1になるよう整理。得意を伸ばすと苦手が残る
  J01:"◎◎○△△", J02:"△○○◎○", J03:"○△○○◎", J04:"○○○○○", J05:"○○△◎○", J06:"△◎△◎○",
  J07:"◎△◎△○", J08:"○△○○◎", J09:"◎○◎△△", J10:"○○△○◎", J11:"△○○○◎", J12:"◎○○△○",
  J13:"○△○○◎", J14:"◎○○△○", J15:"○◎○○△", J16:"◎○◎△△", J17:"○○◎△○", J18:"○△○○◎",
  J19:"△○○◎○", J20:"○△○◎○", J21:"△◎○◎△", J22:"○○△○◎"
};
function baseStats(job, L){
  const g=[...(JOB_STAT_GRADES[job]||"○○○○○")]; const o={};
  STAT_KEYS.forEach((k,i)=>{ const m=GRADE[g[i]]||1, sg=JOB_SIG[job]===k?1.2:1; const [b,gr]=STAT_STD[k]; o[k]=Math.round(b*m)+Math.floor(gr*m*sg*(L-1)); });
  return o;
}
const round1 = x => Math.round(x*10)/10;
/* ---- 能力の導出（第16E・16G・17A節） ---- */
function jpOf(st,cid,job){ return (st.jp[cid]&&st.jp[cid][job])||0; }
function charStats(st, cid, L, jobOverride, equipOverride, exactLevel=false){
  if(!exactLevel)L=st.memberXp?characterLevel(st,cid):Math.min(L,progressionCap(st));
  const job = jobOverride || st.jobs[cid];
  const R = jobRank(st,cid,job);
  const V = Vof(L);
  const eq = equipOverride || st.equip[cid];
  const w = eq.w?EQUIP[eq.w]:null, a = eq.a?EQUIP[eq.a]:null, acc = eq.acc?EQUIP[eq.acc]:null;
  const ok = it => it && L>=(it.needL||1) && (!it.job || (it.job===job && R>=it.needR));
  const W = ok(w)?w:null, A = ok(a)?a:null, X = ok(acc)?acc:null;
  const S = Kof(R) + (W && W.job===job ? 1 : 0);
  const supportHP = 0;
  const rawBase = baseStats(job, L), mastery=masteryPercent(R);
  const permanent=permanentJobBonus(st,cid);
  const base=Object.fromEntries(STAT_KEYS.map(k=>[k,Math.floor(rawBase[k]*(100+mastery+permanent[k])/100)]));
  if(CHARACTER_ARCS[cid]?.defPercent)base.def=Math.floor(base.def*(100+CHARACTER_ARCS[cid].defPercent)/100);
  const gearCrit = ((W&&W.crit)||0)+((A&&A.crit)||0)+((X&&X.crit)||0);
  const maxHP = 2*base.vit + 2*Math.floor(R/2) + V*(((A&&A.hp)||0)+((X&&X.hp)||0)+supportHP);
  const mp=JOB_MP[job]||[16,1.4];
  const startC = Math.min(9999,mp[0]+Math.floor((L-1)*mp[1])+Math.floor(R/2)+((W&&W.c)||0)+((A&&A.c)||0)+((X&&X.c)||0));
  const wAtk=(W&&W.atk)||0, accAtk=(X&&X.atk)||0, armorD=(A&&A.d)||0;
  const defBase = base.def;
  return { L, permanent, job, R, S, V, maxHP, startC, maxMP:startC, extraSkills:extraSkillsFor(st,cid,L,job), base, rawBase, mastery,
    atk: base.str + V*(wAtk+accAtk),               // 最終攻撃力＝ちから＋装備
    defBase, defTotal: defBase + V*armorD,          // 最終防御力＝身の守り＋装備
    crit: Math.min(30, round1(1 + base.agi/6 + gearCrit)), // 会心率％＝すばやさ÷6＋1＋装備
    eva: Math.min(10, round1(base.agi/12)),        // 回避率％
    cha: Math.floor(base.cha/4),                    // 魅力補正％＝魅力÷4（エール・技能の回復量）
    gearCrit,
    wAtk:(W&&W.atk)||0, accAtk:(X&&X.atk)||0, armorD:(A&&A.d)||0,
    commentA:((W&&W.commentA)||0)+((X&&X.commentA)||0)+(CHARACTER_ARCS[cid]?.comment||0),
    rest:((A&&A.rest)||0)+((X&&X.rest)||0)+(CHARACTER_ARCS[cid]?.rest||0),
    meter:((W&&W.meter)||0)+((X&&X.meter)||0),
    family:((W&&W.family)||0)+((X&&X.family)||0),
    pouch:!!(X&&X.pouch), jobWeapon: !!(W && W.job===job) };
}

/* ---- 乱数（抽選値はcommandへ固定する） ---- */
function rand16(){ try{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }catch(e){ return Math.floor(Math.random()*4294967296); } }
function randInt(n){ // 0..n-1 一様（棄却法）
  const lim = Math.floor(4294967296/n)*n; let r; do{ r=rand16(); }while(r>=lim); return r%n;
}

function baseRun(st, kind){

 hp:Math.ceil((d.baseHP+12*(q-1))*diff.hp*T.hp*(1+T.rarHp*rb)*x.hp),

/* ---- 予告（第08・11D節） ---- */
function alive(run){ return run.party.filter(p=>p.hp>0); }
function pickTarget(run, pos){
  const tank = run.party.find(m=>m.hp>0 && m.guard && hasTrait(m,"J03"));
  if(tank) return tank.pos;
  const t = run.party[pos];
  if(t && t.hp>0) return pos;
  const al = alive(run); if(!al.length) return -1;
  let best = al[0]; for(const p of al){ if(p.hp<best.hp) best=p; }
  return best.pos;
}
function enemyAction(run, e){
  const step = e.cycle[(run.turn-1)%e.cycle.length];
  let power = step.p;
  if(e.boss){
    const cueMult = (step.heavy && run.cue && run.cue.ready) ? 0.8 : 1;
    power = step.t==="c" ? 0 : Math.ceil(step.p * e.atkMult * cueMult);
  }
  if(e.boss&&run.pocoRules&&run.turn>=6&&power>0)power=Math.ceil(power*(1+Math.min(0.5,0.1*(1+Math.floor((run.turn-6)/3)))));
  if(e.rage && power>0) power = Math.ceil(power*(e.boss?ENEMY_TUNE.bossRage:ENEMY_TUNE.rage));
  const res = { type: step.t, power, heavy: !!step.heavy, rage: !!e.rage };
  if(step.t==="s") res.target = pickTarget(run, (run.turn-1+e.slot)%run.party.length);
  return res;
}
function telegraph(run){ return run.enemies.filter(e=>e.hp>0).map(e=>({slot:e.slot, ...enemyAction(run,e)})); }
function startTurnCue(run){
  // 怒り：ターン開始時にHPが一定以下なら以後の攻撃が強くなる（予告にも反映）
  for(const e of run.enemies){ if(e.hp>0 && !e.rage && e.hp<=e.maxHP*(e.boss?ENEMY_TUNE.bossRageAt:ENEMY_TUNE.rageAt)){ e.rage=true; run.rageNew=(run.rageNew||[]).concat(e.slot); } }
  if(!run.cue) return;
  if(run.turn%4===3){ run.cue.active=true; run.cue.bits=[]; run.cue.ready=false; }
  else run.cue.active=false;
}

/* ---- 行動の検証と適用（第09・10・10F節） ---- */
function effectiveEnemyDefense(actor,enemy,ignore=false){return ignore?0:hasTrait(actor,"J16")?Math.floor(enemy.def/2):enemy.def;}
function battleQuake(run){return run.party.some(m=>m.hp>0&&hasTrait(m,"J17"))?2*run.V:0;}
function incomingDamage(run,target,act,critical=false,quake=battleQuake(run)){
 let n=critical?Math.ceil(act.power*1.5):Math.max(0,act.power-(target.defBase||0)-(target.V||run.V)*(target.armorD+target.ward)-(act.type==='a'?quake:0));
 return target.guard?Math.ceil(n/2):n;
}
function battleAleGain(run,amount){const old=run.A;run.A=Math.min(100,run.A+amount);return run.A-old;}
function singleDamage(run, actor, extra, enemy, opts={}){
  const L=actor.L||run.L, V=actor.V||run.V;
  const def=effectiveEnemyDefense(actor,enemy,opts.ignoreDef);
  const atk = opts.noGear ? 0 : actor.wAtk + actor.accAtk;
  let ex = extra, B = run.B;
  if(opts.kind==="attack" && hasTrait(actor,"J05")) ex+=3;
  if(hasTrait(actor,"J06") && actor.hp<=actor.maxHP*0.3) ex+=8;
  if(hasTrait(actor,"J19")){ const st=enemy.cycle[(run.turn-1)%enemy.cycle.length]; if(st&&st.t==="c") ex+=6; }
  if(hasTrait(actor,"J21")) B=Math.ceil(B*1.5);
  const power = actor.str!=null ? actor.str : 10+2*L;
  const damage=Math.max(1,power+V*(ex+atk+B)-def);
  return opts.kind==="attack"&&enemy.boss&&run.pocoRules&&run.A<40&&!run.kiraDone?Math.max(1,Math.floor(damage*0.65)):damage;
}
function chainAdvance(run, actor, line){
  if(run.kiraDone) return false;
  const st=run.chain.stage, mem=run.chain.members.includes(actor.cid);
  return (line==="greet"&&st===0) || (line==="plan"&&st===1&&!mem) || (line==="thanks"&&st===2&&!mem);
}
function cueProgress(run, actor, kind){
  return !!(run.cue && run.cue.active && !run.cue.ready && run.cue.kind===kind && !run.cue.bits.includes(actor.cid));
}
/* 行動の予測と可否。effects 配列は適用用の差分を表す */
function planAction(run, idx, act){

  const S=a.S, V=a.V||run.V, L=a.L||run.L;
  if(a.acted) return {ok:false, reason:"このターンは行動済みです。"};
  if(run.state!=="input") return {ok:false, reason:"入力待ちではありません。"};
  const al = alive(run); const en = run.enemies.filter(e=>e.hp>0);
  const p = { ok:true, cost:{c:0,a:0,hp:0}, dmg:[], heal:[], cgain:[], ward:[], aGain:0, setB:null, consumeB:false, chain:null, cue:null, text:[], valid:false, kind:act.type };

/* ---- 名前の検証（第06E節。文字数はユーザー指定で1～12文字） ---- */
const NAME_MAX = 12;
const HW_KANA = "｡｢｣､･ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
const FW_KANA = "。「」、・ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン";
function normalizeName(raw){
  let s = raw.replace(/^[ 　]+|[ 　]+$/g,"");
  s = s.replace(/[A-Za-z0-9]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0xFEE0));
  let out="";
  for(let i=0;i<s.length;i++){
    const ch=s[i], k=HW_KANA.indexOf(ch);
    if(k>=0){ let f=FW_KANA[k]; const nx=s[i+1];
      if(nx==="ﾞ"){ const v=(f+"゙").normalize("NFC"); if(v.length===1){ f=v; i++; } }
      else if(nx==="ﾟ"){ const v=(f+"゚").normalize("NFC"); if(v.length===1){ f=v; i++; } }
      out+=f; }
    else if(ch==="ﾞ") out+="゙"; else if(ch==="ﾟ") out+="゚";
    else out+=ch;
  }
  return out.normalize("NFC");
}
function graphemes(s){
  try{ if(Intl.Segmenter) return Array.from(new Intl.Segmenter("ja",{granularity:"grapheme"}).segment(s), x=>x.segment); }catch(e){}
  return Array.from(s.normalize("NFC"));
}
function nameCharOk(g){
  if(g.length>2) return false;
  if([...g].length!==1) return false;
  const c=g.codePointAt(0);
  if(c>=0x3041&&c<=0x3096) return true;
  if(c>=0x30A1&&c<=0x30FA) return true;
  if("々〆〇ーゝゞヽヾ".includes(g)) return true;
  if((c>=0xFF21&&c<=0xFF3A)||(c>=0xFF41&&c<=0xFF5A)||(c>=0xFF10&&c<=0xFF19)) return true;
  try{ return /^\p{Script=Han}$/u.test(g); }catch(e){ return (c>=0x4E00&&c<=0x9FFF)||(c>=0x3400&&c<=0x4DBF)||(c>=0x20000&&c<=0x2FFFF)||(c>=0xF900&&c<=0xFAFF); }
}
function validateName(raw){
  const s=normalizeName(raw); const gs=graphemes(s); const errors=[];
  gs.forEach((g,i)=>{ if(!nameCharOk(g)) errors.push(`${i+1}文字目「${/\s/.test(g)?"空白":g}」は使えません（使える文字：ひらがな・カタカナ・漢字・全角英数字）。`); });

  if(gs.length>NAME_MAX) errors.push(`${gs.length}文字です。${NAME_MAX}文字以内に直してください。`);
  return { value:s, count:gs.length, errors, ok:errors.length===0 };
}

  if(need==="ally") al.forEach(p=>out.push({type:"skill",ally:p}));
  if(need==="allyOther") others.forEach(p=>out.push({type:"skill",ally:p}));
  if(need==="line") ["greet","plan","thanks"].forEach(l=>out.push({type:"skill",line:l}));

function aiChoose(run){

  }
  return best;
}

function bagAdd(bag,id,n){ if(typeof id!=='string'||!Object.prototype.hasOwnProperty.call(ITEMS,id)||!Number.isSafeInteger(n)||n<=0)return 0; const add=Math.min(n,bagRoom(bag,id)); if(add<=0) return 0; const e=bag.find(x=>x.id===id); if(e) e.n+=add; else bag.push({id,n:add}); const owner=collectionBagOwner(bag);if(owner)collectionMark(owner,id);return add; }
function bagRemove(bag,id,n){ if(!Number.isSafeInteger(n)||n<=0)return 0; const i=bag.findIndex(x=>x.id===id); if(i<0) return 0; const r=Math.min(n,bag[i].n); bag[i].n-=r; if(bag[i].n<=0) bag.splice(i,1); return r; }
function giveItem(st,id,n,res,why){
  if(typeof id!=='string'||!Object.prototype.hasOwnProperty.call(ITEMS,id)||!Number.isSafeInteger(n)||n<=0)return {got:0,kept:0,lost:0};
  st.bag=st.bag||[]; st.keep=st.keep||[];
  const got=bagAdd(st.bag,id,n); let rest=n-got, kept=0;
  while(rest>0 && st.keep.length<KEEP_MAX){ st.keep.push(id); rest--; kept++; }
  if(res){ res.items=res.items||[]; res.itemsKept=res.itemsKept||[]; res.itemsLost=res.itemsLost||[];
    if(got) res.items.push({id,n:got,why}); if(kept) res.itemsKept.push({id,n:kept}); if(rest) res.itemsLost.push({id,n:rest}); }
  if(got||kept)collectionMark(st,id);return {got,kept,lost:rest};
}
function flushKeep(st){ // 預かり所から袋へ（安全地帯で呼ぶ）
  if(!st.keep||!st.keep.length) return 0; let moved=0; const left=[];
  for(const id of st.keep){
    if(EQUIP[id]){ if(eqCanAdd(st,id,1)){ st.owned[id]=(st.owned[id]||0)+1; moved++; } else left.push(id); }
    else if(bagAdd(st.bag,id,1)) moved++; else left.push(id); }
  st.keep=left; return moved;
}
function itemAmount(it, k, maxHP, V, boost){
  const e=it.eff; let v=0;
  if(k==="hp"){ if(e[0]==="hp"||e[0]==="hpc") v=e[1]*V; else if(e[0]==="hp%"||e[0]==="hpc%") v=Math.ceil(maxHP*e[1]/100); }
  if(k==="rev"){ v=Math.ceil(maxHP*e[1]/100); }
  return boost? Math.ceil(v*2) : v;
}
function itemC(it, capRoom){ const e=it.eff; if(e[0]==="c") return e[1]; if(e[0]==="cfull") return capRoom; if(e[0]==="hpc") return e[2]; if(e[0]==="hpc%") return capRoom; return 0; }
function itemNeeds(it){ // 対象の種類
  if(it.cat==="攻撃") return it.target==="敵全体"?"enemyAll":"enemy";
  if(it.cat==="蘇生") return it.target.includes("全員")?"downAll":"down";
  return it.target.includes("全員")?"allyAll":"ally";
}
/* 戦闘中の道具（1行動。エール・コメント連携・JPの有効行動・初撃破エール・ボス対処には数えない） */
function planItem(run,a,act,p,h){
  const it=ITEMS[act.item]; p.item=act.item; p.chain=null;
  if(!it){ p.ok=false; p.reason="道具を選んでください。"; return; }
  if(!canUseJobItem(a.job,a.R,it)){p.ok=false;p.reason=jobItemRequirement(it);return;}
  if(bagCount(run.bag,it.id)<=0){ p.ok=false; p.reason="その道具は持っていません。"; return; }
  const need=itemNeeds(it), V=h.V, boost=a.pouch && it.cat!=="攻撃";
  const mk=(v)=> hasTrait(a,"J04") && it.cat!=="攻撃" ? Math.ceil(v*1.25) : v;
  const healOne=(t)=>{ const hp=mk(itemAmount(it,"hp",t.maxHP,V,boost)); if(hp) h.heal(t,hp); const cc=itemC(it,(t.maxC||10)-t.c); if(cc) h.addC(t,mk(cc)); };
  if(need==="enemy"||need==="enemyAll"){
    const list = need==="enemy" ? [h.needEnemy()].filter(Boolean) : run.enemies.filter(e=>e.hp>0);
    if(!list.length){ p.ok=false; p.reason="対象の敵を選んでください。"; return; }
    for(const e of list){ const d=Math.max(1, it.eff[1]*V - e.def); p.dmg.push({slot:e.slot, amt:Math.min(d,e.hp), raw:d}); }
    if(need==="enemyAll") p.all=true;
  } else if(need==="ally"){ const t=h.needAlly(); if(!t){ p.ok=false; p.reason="対象を選んでください。"; return; } healOne(t); }
  else if(need==="allyAll"){ for(const t of run.party.filter(m=>m.hp>0)) healOne(t); }
  else { // 蘇生
    const downs = run.party.filter(m=>m.hp<=0);
    const list = need==="downAll" ? downs : downs.filter(m=>m.pos===act.ally);
    if(!downs.length){ p.ok=false; p.reason="戦闘不能の仲間がいません。"; return; }
    if(!list.length){ p.ok=false; p.reason="復活させる仲間を選んでください。"; return; }
    for(const t of list) p.heal.push({pos:t.pos, amt:Math.min(t.maxHP,mk(itemAmount(it,"rev",t.maxHP,V,boost))), revive:true});
  }
  const effect = p.dmg.length || p.heal.some(x=>x.amt>0||x.revive) || p.cgain.some(x=>x.amt>0);
  if(!effect){ p.ok=false; p.reason="今は効果がありません。"; return; }
  p.valid=false; p.aGain=0;
}
/* 移動中の道具（攻撃道具は使えない）。MPの上限は最大MP */
function useItemField(st, id, cid){
  const it=ITEMS[id]; if(!it) return {ok:false, reason:"道具がありません。"};
  if(it.battleOnly) return {ok:false, reason:"戦闘中だけ使える道具です。"};
  if(st.run) return {ok:false, reason:"戦闘中は戦闘の道具コマンドから使います。"};
  if(it.job&&(!st.roster.includes(cid)||!canUseJobItem(st.jobs[cid],jobRank(st,cid,st.jobs[cid]),it)))return {ok:false,reason:jobItemRequirement(it)+"（移動中は本人に使用）"};
  if(bagCount(st.bag,id)<=0) return {ok:false, reason:"その道具は持っていません。"};
  ensureVitals(st); const L=partyLevel(st), V=Vof(L), need=itemNeeds(it);
  const all = need==="allyAll"||need==="downAll";
  const targets = all ? st.roster.slice() : [cid];
  const log=[]; let any=false;
  for(const c of targets){
    const s=charStats(st,c,L), v=st.vitals[c]; if(!v) continue; const boost=s.pouch;
    if(need==="down"||need==="downAll"){ if(v.hp>0) continue; v.hp=Math.min(s.maxHP,itemAmount(it,"rev",s.maxHP,V,boost)); any=true; log.push(`${charName(st,c)}が復活（HP${v.hp}）`); continue; }
    if(v.hp<=0){ continue; }
    const hp=Math.min(itemAmount(it,"hp",s.maxHP,V,boost), s.maxHP-v.hp); const cc=Math.min(itemC(it,s.startC-v.c), s.startC-v.c);
    if(hp>0){ v.hp+=hp; any=true; log.push(`${charName(st,c)}のHP＋${hp}`); }
    if(cc>0){ v.c+=cc; any=true; log.push(`${charName(st,c)}のMP＋${cc}`); }
  }
  if(!any) return {ok:false, reason: (need==="down"||need==="downAll") ? "戦闘不能の仲間がいません。" : "今は効果がありません（戦闘不能の人には回復道具が効きません）。"};
  bagRemove(st.bag,id,1);
  return {ok:true, log};
}

  const keep=[]; const protect=(w)=>{ if(!w) return; t=t.split(w).join("\u0001"+keep.length+"\u0002"); keep.push(w); };

  const tok=w=>{ keep.push(w); return "\u0001"+(keep.length-1)+"\u0002"; };
  const full=tok(H.name), sh=tok(short);

function manageTabs(list,current,action){return `<nav class="m-tabs" aria-label="表示の切り替え">${list.map(([k,t])=>`<button class="btn ${k===current?'on':''}" data-a="${action}" data-v="${k}" aria-pressed="${k===current}">${t}</button>`).join('')}</nav>`;}

function manageSearch(d,options){return `<form id="manageSearchForm" class="m-search"><label>名前・効果で探す<input id="manageQuery" type="search" maxlength="60" value="${esc(d.uiQuery||'')}" placeholder="名前・効果・職業" enterkeyhint="search"></label><label>絞り込み<select id="manageFilter" aria-label="一覧の絞り込み">${options.map(([k,t])=>`<option value="${k}" ${(d.uiFilter||'all')===k?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn primary" type="submit">検索</button><button class="btn" type="button" data-a="manageClear">解除</button></form>`;}
function manageMatch(text,q){return guideSearchText(q||'').split(' ').filter(Boolean).every(w=>guideSearchText(text).includes(w));}
function manageEmpty(){return '<p class="m-notice" role="status">見つかりません。検索の「解除」か、別の種類を選んでください。</p>';}
function manageNotice(d){return d.notice?`<p class="m-notice good" role="status">${esc(d.notice)}</p>`:'';}
function manageStats(s,v=null){const rows=v?[['HP',v.hp,'最大 '+manageNumber(s.maxHP)],['MP',v.c,'最大 '+manageNumber(s.startC)],['攻撃力',s.atk,'ちから＋武器など'],['防御力',s.defTotal,'身の守り＋防具']]:[['最大HP',s.maxHP,''],['最大MP',s.startC,''],['攻撃力',s.atk,''],['防御力',s.defTotal,'']];return `<div class="m-stats">${rows.map(([k,n,sub])=>`<div><span>${k}</span><b>${manageNumber(n)}</b>${v&&(k==='HP'||k==='MP')?`<span class="bar ${k==='MP'?'mp':''}"><i style="width:${Math.max(0,Math.min(100,n/(k==='HP'?s.maxHP:s.startC)*100))}%"></i></span>`:''}<small>${sub}</small></div>`).join('')}</div>`;}
function manageComparison(cur,nx){const a=statRows(cur,cur.L),b=statRows(nx,nx.L),card=(k,v,w)=>{const diff=typeof v==='number'&&typeof w==='number'?round1(w-v):null;return `<div class="m-diff"><span>${k}</span><span class="${diff>0?'up':diff<0?'down':''}">${diff===null?(v===w?'変化なし':'効果変更'):diff===0?'±0':(diff>0?'＋':'−')+manageNumber(Math.abs(diff))}</span><div><small>今</small> ${manageNumber(v)}</div><div><small>変更後</small> <b>${manageNumber(w)}</b></div></div>`;},key=['最大HP','最大MP','攻撃力','防御力'];return `<div class="m-compare" aria-label="変更前と変更後の能力">${key.map(k=>{const i=a.findIndex(x=>x[0]===k);return card(k,a[i][1],b[i][1]);}).join('')}</div><details class="m-details"><summary>その他の能力・効果の変化</summary><div class="m-compare">${a.flatMap(([k,v],i)=>!key.includes(k)&&v!==b[i][1]?[card(k,v,b[i][1])]:[]).join('')||'<p>その他の能力は変わりません。</p>'}</div></details>`;}
function manageGain(cur,nx){return [['攻撃',cur.atk,nx.atk],['防御',cur.defTotal,nx.defTotal],['HP',cur.maxHP,nx.maxHP],['MP',cur.startC,nx.startC]].map(([k,v,w])=>{const n=round1(w-v);return `<span class="${n>0?'up':n<0?'down':''}">${k} ${n>0?'＋':n<0?'−':'±'}${manageNumber(Math.abs(n))}</span>`;}).join(' ');}
function manageGearNote(st,cid,it){return canEquipC(st,cid,it)?'装備可能':equipRequirement(it)+'が必要（現在Lv'+characterLevel(st,cid)+'・'+JOBS[st.jobs[cid]].name+' 熟練度'+jobRank(st,cid,st.jobs[cid])+')';}
function manageSkills(st,cid,d){const s=charStats(st,cid,partyLevel(st)),known=new Set(s.extraSkills),base={id:'CURRENT',name:JOBS[s.job].skill,cost:JOBS[s.job].cost,desc:JOBS[s.job].desc(s.S),current:true};let list=[base,...Object.values(EXTRA_SKILLS).filter(sk=>sk.baseJob!==s.job&&(known.has(sk.id)||sk.id===ultimateId(cid)||sk.job===s.job&&!sk.baseJob)).map(sk=>({...sk,locked:!known.has(sk.id)}))];const f=d.uiFilter||'all';list=list.filter(sk=>manageMatch(sk.name+' '+sk.desc+' '+(sk.job?JOBS[sk.job]?.name:''),d.uiQuery)&&(f==='all'||f==='known'&&!sk.locked||f==='locked'&&sk.locked||f==='ultra'&&sk.ultra||f==='ultimate'&&sk.ultimate));return managePage(list,d);}

 const key=JSON.stringify([cid,slot,id,st.roster.map(c=>[c,st.jobs[c],characterLevel(st,c),jpOf(st,c,st.jobs[c]),st.equip[c]]),id?st.owned[id]||0:0]);

function shopPool(st,d){const S=SHOPS[d.shop];if(!S)return [];const tab=d.tab||'buy';if(tab==='item')return shopItemsFor(curHub()).filter(id=>ITEMS[id]);if(tab==='sell')return [...Object.keys(st.owned).filter(id=>EQUIP[id]&&(st.owned[id]||0)>0),...st.bag.filter(x=>x.n>0&&ITEMS[x.id]).map(x=>x.id)];return [...new Set([...S.items,...JOB_IDS.filter(j=>st.gifts.W[j]).map(j=>'JW'+j.slice(1)),...JOB_IDS.filter(j=>st.gifts.A[j]).map(j=>'JA'+j.slice(1))])].filter(id=>EQUIP[id]);}

function shopQuote(st,d,context=false){
 if(!st)return {reason:'店に入り直してください。',max:0,q:0,unit:0,total:0,after:0};
 const id=d.item,isItem=Object.prototype.hasOwnProperty.call(ITEMS,id),it=isItem?ITEMS[id]:Object.prototype.hasOwnProperty.call(EQUIP,id)?EQUIP[id]:null,tab=d.tab||'buy',sell=tab==='sell',q=d.qty==null?1:Number(d.qty);let reason=context?shopContextReason(st,d):'';

 const rawUnit=sell?(isItem?it.sell:Math.floor(it.price/2)):it.price,unit=Math.max(0,rawUnit),own=isItem?bagCount(st.bag,id):st.owned[id]||0;
 let max=sell?(isItem?own:availableCount(st,id)):isItem?bagRoom(st.bag,id):Math.max(0,8-own);
 if(sell&&rawUnit<0)max=0;
 if(!sell){if(isItem&&!jobItemUnlocked(st,it)||!isItem&&it.nonSale)max=0;if(!isItem)while(max>0&&!eqCanAdd(st,id,max))max--;max=Math.min(max,unit>0?Math.floor(st.gold/unit):max);}
 max=Math.max(0,Math.min(99,max));
 if(!Number.isInteger(q)||q<1)reason=reason||'数量は1個以上の整数で選んでください。';
 if(!sell&&isItem&&!jobItemUnlocked(st,it))reason=reason||jobItemRequirement(it)+'を満たす仲間が必要です。';
 if(!sell&&!isItem&&it.nonSale)reason=reason||'この品は店で購入できません。';
 if(sell&&rawUnit<0)reason=reason||'この道具は売却できません。';
 if(!reason&&q>max)reason=max>0?'今は'+max+'個までです。数量を減らしてください。':sell?'売却できる未装備の品がありません。':!isItem&&own>=8?'1種類の所持上限は8個です。':isItem&&bagRoom(st.bag,id)<=0?'道具袋の種類数か個数がいっぱいです。':!isItem&&!eqCanAdd(st,id,1)?'未装備の持ち物の種類数がいっぱいです。':'ゴールドが足りません。';

/* ---- 移動（v5.30 なめらか化）：1マスの所要時間、押しっぱなしの連続歩行、壁沿いのすべり ---- */
function moveStepMs(){ const s=G.st?G.st.settings:null; return s&&s.moveSpeed==="fast"?110:160; }
function faceToward(n){ const dx=n.x-G.st.pos.x, dy=n.y-G.st.pos.y; G.st.dir = dy>0?0:dy<0?1:dx<0?2:3; }
/* 押している方向（第1方向がふさがっていれば斜め入力のもう一方へすべる） */
function nextStepFor(h){
  const st=G.st, m=MAPS[st.mapId]; if(!h) return null;
  for(const d of [h.dir,h.alt]){ if(d==null) continue; const v=[[0,1],[0,-1],[-1,0],[1,0]][d]; const nx=st.pos.x+v[0], ny=st.pos.y+v[1]; if(!walkable(m,nx,ny)) continue;
    // 扉を通った直後は、いったん手を離すまで次の扉へは入らない（出入りの往復を防ぐ）
    if(G.bumpLock){ const o=objAt(m,nx,ny); if(o&&["door","gate","worldExit","cityEntry"].includes(o.type)) continue; }
    return {x:nx,y:ny,d}; }
  return null;
}
/* 1マス着いた瞬間に、押しっぱなしなら次の1マスを先に積む（止まらずに歩き続ける） */
function chainHeld(){
  const w=G.walk; if(w.path.length||w.pending||G.readOnly) return;
  const h=PAD.held(); if(!h||h.dir==null) return;
  const m=MAPS[G.st.mapId], o=objAt(m,G.st.pos.x,G.st.pos.y); if(o&&o.walk) return; // 扉・ボス地点では止まる
  const s=nextStepFor(h); if(s) w.path.push({x:s.x,y:s.y});
}
function startLoop(){
  cancelAnimationFrame(G.raf); G.lastTs=0;
  const loop=ts=>{
    if(G.screen!=="explore"||document.hidden){syncMapTravelLayout(); G.raf=0; return; }
    const dt = G.lastTs? Math.min(50, ts-G.lastTs) : 16; G.lastTs=ts; G.frame++;
    const w=G.walk;
    if(w.path.length && !G.dlg && !G.sheet && !G.lock){
      faceToward(w.path[0]);
      w.prog+=dt/moveStepMs();
      let guard=0;
      while(w.prog>=1 && w.path.length && guard++<3){
        const n=w.path[0], carry=w.prog-1;
        w.path.shift();if(G.followMap!==G.st.mapId){G.followMap=G.st.mapId;G.followTrail=[];}G.followTrail=[{...G.st.pos},...(G.followTrail||[])].slice(0,3); G.fol={...G.st.pos}; G.st.pos={x:n.x,y:n.y};

        arrive();

        if(w.path.length && G.screen==="explore" && !G.dlg && !G.sheet){ w.prog=carry; faceToward(w.path[0]); }
        else { w.prog=0; break; }
      }
    }
    drawMap();
    G.raf=requestAnimationFrame(loop);
  };
  G.raf=requestAnimationFrame(loop);
}
function bfs(m,sx,sy,goal,preferRoad=true){
  const key=(x,y)=>y*m.w+x,prev=new Map(),q=[{x:sx,y:sy}];prev.set(key(sx,sy),null);
  const open=m.mapScope==='world'?new Set(HUB_ORDER.filter(id=>hubUnlocked(G.st,id))):null;
  const can=(x,y)=>{if(!open)return walkable(m,x,y);const k=x+','+y;if(!(m.owners[k]||[]).some(id=>open.has(id)))return false;return !!WORLD_TERRAIN[m.tiles[y]?.[x]]?.[2];};
  if(open&&preferRoad){const route=worldPreferredPath(m,sx,sy,goal,can);if(route?.length)return route;}
  for(let head=0;head<q.length;head++){const{x,y}=q[head];if(goal(x,y)&&!(x===sx&&y===sy)){const path=[];let k=key(x,y);while(k!==key(sx,sy)){path.push({x:k%m.w,y:Math.floor(k/m.w)});k=prev.get(k);}return path.reverse();}
    for(const[dx,dy]of [[0,1],[0,-1],[-1,0],[1,0]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=m.w||ny>=m.h)continue;const k=key(nx,ny);if(prev.has(k)||!can(nx,ny))continue;prev.set(k,key(x,y));q.push({x:nx,y:ny});}}
  return null;
}

function walkTo(x,y,pending,isNavigation=false){
  const st=G.st;if(!st||worldMoveReason(st))return;const m=MAPS[st.mapId];if(!m||!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>=m.w||y>=m.h)return; if(G.readOnly) return toast("閲覧のみのタブです。");
  let path;
  const obj=objAt(m,x,y);
  if(obj && !obj.walk && m.mapScope!=='world'){ if(Math.abs(obj.x-st.pos.x)+Math.abs(obj.y-st.pos.y)===1 || (Math.max(Math.abs(obj.x-st.pos.x),Math.abs(obj.y-st.pos.y))<=1)){if(m.mapScope==='world'&&!isNavigation){G.worldNav=null;G.worldNavState=null;G.walk.path=[];G.walk.pending=null;} interact(obj); return; }
    path=bfs(m,st.pos.x,st.pos.y,(px,py)=>Math.abs(px-x)+Math.abs(py-y)===1); pending=obj; }
  else { if(x===st.pos.x&&y===st.pos.y) return; if(!walkable(m,x,y)){if(m.mapScope==='world')toast(!worldTileOpen(x,y,st)?'未開放エリア：まだ移動できません。':'海・川には移動できません。');return;} path=bfs(m,st.pos.x,st.pos.y,(px,py)=>px===x&&py===y,m.mapScope!=='world'||!!obj||Object.hasOwn(m.walkRoadIndex,x+','+y)); }
  if(!path) return toast("そこへは行けません。");
  if(m.mapScope==='world'&&!isNavigation){G.worldNav=null;G.worldNavState=null;}G.walk.path=path; G.walk.prog=0; G.walk.pending=pending||(obj&&(obj.walk||m.mapScope==='world')?obj:null);syncMapTravelLayout();
}
function onMapTap(e){if(G.sheet||G.dlg||G.screen!=='explore'||G.readOnly)return;const cv=G.cv;if(!cv)return;const p=mobileMapTile(e,cv.getBoundingClientRect(),camera(),G.vw,G.vh),m=MAPS[G.st.mapId];if(p&&p.x>=0&&p.y>=0&&p.x<m.w&&p.y<m.h)walkTo(p.x,p.y);}

function arrive(){

    const canFight = st.party.some(c=>vitalOf(c).hp>0);
    if(canFight && randInt(24)===0){
      const rolls={count:randInt(100), picks:[randInt(10000),randInt(10000),randInt(10000)]};
      G.walk.path=[]; G.walk.pending=null;

    const pend=G.walk.pending; G.walk.pending=null;

 add('party','start','同行者は2～4人：主人公とヒロインは必須',p('二人はいつも同行します。ほかの仲間は0～2人まで選べます。最大4人です。街のファミリー施設で「編成」を開くと、ほかの仲間を控えと入れ替えられます。主人公とヒロインは外せません。')+p('経験値と職業の熟練度をもらえるのは、その戦闘に参加した仲間だけです。控えの経験値は減りません。パーティレベルは、同行者の経験値の平均から決まるので、入れ替えると表示が変わることがあります。'),'人数 交代 控え 主人公 ヒロイン ファミリー 経験値');
 add('stats','growth','HP・MP・攻撃力・防御力の意味',p('HPは元気です。0になると戦闘不能。MPは技を使う力です。技を使うと減り、足りないと使えません。宿屋や回復道具で戻せます。')+p('攻撃力は「ちから＋武器など」、防御力は「身の守り＋防具」です。身の守りも防御力に入ります。装備の数値はレベルによる成長係数で強くなるものがあります。編成・ステータス画面で実際の合計値を確認できます。')+p('最大MPはレベルアップと熟練度で増えます。増え方は職業ごとに違います。レベルアップした本人のHPとMPは全回復。レベルが上がっていない仲間は全回復しません。'),'集中力 最大MP レベルアップ ステータス 身の守り');
 add('limits','growth','章ごとの上限とボス攻略の目安',p('レベルと職業熟練度は、章が解放されるたびに100ずつ上限が上がり、最後は999です。本編ボスは、強い装備と複数の職業技を使えば、その章の上限の半分くらいでも挑める目安にしました。人数・職業・操作・難易度で結果は変わります。超レア装備は必須ではありません。')+'<div class="guide-table"><table><thead><tr><th>章</th><th>上限</th><th>本編終盤の目安</th><th>地域特別の目安</th></tr></thead><tbody>'+SYSTEM_CHAPTERS.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+c.cap+'</td><td>Lv'+c.target+'＋強い装備・技</td><td>'+(c.special?'Lv'+c.cap+'＋強い装備':'高レベルの特設エリアで育成')+'</td></tr>').join('')+'</tbody></table></div>'+p('ここでいう地域特別の上限は、その地域の章の上限です。たとえば九州の特別エリアはLv100が目安です。次の章が開いて上限200になっていても、九州特別の目安は100です。上限に達すると経験値・熟練度の加算は止まり、次の上限が開いてから再び育ちます。'),'MAX レベル50 レベル100 レベル999 難易度');
 add('training','growth','レベルと熟練度は別のもの',p('レベルはキャラの育ち方、熟練度はその職業での練習量です。戦闘に参加して勝つと増えます。高くなるほど次の段階までに必要な量が増えます。弱い敵ばかりより、準備をして適正レベルの敵に挑む方が育成に向いています。')+p('技能強化が上がる熟練度：'+MASTERY_STEPS.join('・')+'。現在職の武器を使うと技能強化がさらに1増えます。')+p('職業の基礎能力補正は熟練度999で47％。熟練度による最大MPは「熟練度÷2」の小数点以下を切り捨てた分が加わります。'),'JP XP 育成 必要経験値');
 add('changeJob','growth','転職すると、何が残る？',p('街の「職」ハローワークで、その職業の専用イベントを3段階クリアします。その後「転職する」→仲間→職業→能力を確認して確定。クリア記録は仲間全員で共通、転職は無料です。編成画面から直接の転職はできません。職業で覚えた技と職業ごとの熟練度は残ります。前の職業の専用装備・専用道具は、違う職業では使えません。共有装備には本人のレベル条件があります。')+p('普段の能力と職業特性は、今の職業のものになります。前の職業から能力として持ち越せるのは「永続ボーナス」です。複数の職業の分を足し、各能力＋45％まで。熟練度'+JOB_BONUS_STEPS.join('・')+'で新しい段階に進みます。')+p('引き継いだ技の条件と強さには、その技の元の職業の熟練度を使います。レベルや上限の条件に届かない間は使えません。'),'ジョブチェンジ 引継ぎ 永続ボーナス 専用装備');
 add('turn','battle','ターン制バトル：予告を見てから行動',p('同行者が全員戦闘不能の時は戦闘を始められません。道具や宿屋で復活させましょう。途中の戦闘を再開して全員戦闘不能なら、敗北画面から安全な場所へ戻れます。戦闘中・敗北・撤退では報酬をもらえず、勝利した戦闘の報酬は1回だけです。')+p('生きている仲間が1回ずつ行動すると敵の番です。敵の「次」の表示で、単体・全体・ためを見分けましょう。防御や回復も大切な1回の行動です。')+p('通常戦・ボス戦・特別チャレンジのすべてでオートを使えます。「AUTO」で開始、「停止」で手動へ戻れます。自動で進む方法と、タップで1手ずつ進む方法があります。特別チャレンジは決められた課題も必要です。オートで必ず勝てるわけではありません。メニュー・解説・会話を開いている間や、ゲーム画面が隠れている間は次の行動を待ちます。')+p('ガードは受けるダメージを減らし、MPも1戻します。休息はMPを4＋装備などの休息ボーナス分戻します。防護は敵の攻撃を軽くしますが、敵の行動後に消えます。'),'オート 自動 手動 進行コメント 戦闘結果');
 add('links','battle','エール・コメント連携・キラコメの使い分け',renderBattleSupportHelp(),'連携技 挨拶 作戦 感謝 エール40 エール80 ファミリー応援 メーター突破');
 add('twoPeople','battle','2人編成でも戦える？ キラコメは？',p('主人公とヒロインの2人だけでも戦えます。地域ボスは、戦闘を始めた人数に合わせてHPや攻撃を調整します。')+p('キラコメは別の3人が必要なので2人では完成できません。2人でもエール、コメント連携、ファミリー応援、メーター突破は使えます。人数が少ない時は、回復と攻撃の役割を二人で分け、引き継いだ技も活用しましょう。'),'2人 3人 少人数');
 add('boss','battle','ボスの盾・ため攻撃・長期戦',p('身の守り・防具・防護でダメージを減らします。建築士の耐震設計は、一つの全体攻撃が始まった時に働いていれば、その攻撃の全員に効きます。建築士が倒れた後の、別の敵の攻撃には効きません。痛恨は防御と防護を無視しますが、ガードによる半減は残ります。')+p('ボスのノイズシールドは通常攻撃を35％減らします。エール40以上かキラコメ完成で解除でき、職業技は最初からこの軽減を受けません。')+p('ための予告で求められた行動を、別の2人で行うと、直後の強攻撃を20％軽減しエール＋12。求められるのはガード・応援コメント・攻撃などで、戦闘画面に表示されます。')+p('6ターン目以降は3ターンごとにボスの攻撃＋10％、最大＋50％。ボスのHPが40％以下になると怒りで攻撃がさらに25％増えます。回復だけを続けず、強い技で攻める時間も作りましょう。'),'対処 シールド 怒り');
 add('combo','battle','技の組み合わせ例：準備してから強く攻める',p('例1：システムエンジニアの「コメント整理」などでエールと連携を用意→トラック運転手の「巡回ストライク」などの単体攻撃で連携を使う。')+p('例2：建築士の全体防護→看護師の回復で立て直す→攻撃役が防御無視の技で攻める。例3：調理師のMP補給→ライバーや専業主婦の回復を続ける。')+p('転職で覚えた技を持ち寄ると、同じキャラでも役割を増やせます。再使用待ちのある技は連発できません。技の条件・消費MPを調べて、異なる技を順番に使いましょう。'),'連携技 コンボ 回復役 攻撃役');
 add('skillRules','skills','技の読み方：習得条件・MP・再使用待ち',p('職業技の課題は、現在職の基本技・追加の職業技・前職から覚えた職業技で進みます。超レア装備の固有技とキャラ固有の必殺技は、その回数に入りません。回復や防護などが何も増えず、減らした自分のMPを戻すだけの技は使いません。無効な行動ではMPも道具も減りません。')+p('「Lv」は本人のレベル、「熟練度」はその技の職業の熟練度です。両方の条件があれば、両方を満たします。「再使用待ち3ターン」は、使った後の3ターンは同じ技を使えず、その次のターンから使えます。')+p('超レア装備の固有技は、その装備を着けている本人だけが使えます。外す・別の品へ替える・装備条件を満たさなくなると使えません。持っているだけ、預かり所に置く、一度装備しただけでは使えません。別の仲間へ渡すと、装備した仲間だけが使えます。普通の職業技や人物固有の必殺技は、この装備ルールの対象ではありません。')+p('「単体」は1人または1体、「全体」は生きている対象全員。「防御無視」は敵の防御力を引かずに攻撃することです。小数点の切り捨ては端数を捨て、切り上げは次の整数にします。'),'用語 小学生 クールダウン');
 add('rareRules','rare','章限定の超レア：どこで、何％で落ちる？',p('各章に武器・防具・アクセサリーの3品があります。'+SYSTEM_CHAPTERS.length+'章で'+SYSTEM_CHAPTERS.reduce((n,c)=>n+c.ultra.length,0)+'品。どれも、その章と地域特別エリアの店売り最上位品を上回る性能です。全職業で装備できますが、本人のレベル条件は必要です。')+p('通常戦闘は勝利1回ごとに1/'+CHAPTER_DROP_RULES.field+'（0.5％）、ボスは1/'+CHAPTER_DROP_RULES.boss+'（2.5％）で超レアに当たり、その章の3品から同じ確率で1品を選びます。敵1体ごとの抽選ではありません。特別チャレンジは対象外です。')+p('何回戦っても必ず出る保証はありません。ボス再戦でも抽選されます。次の章の品が前の章で落ちることはありません。章限定超レアは、ふつうの共通装備より強い特別な例外です。'),'隠し要素 ドロップ 確率 0.5 2.5');
 add('rareOther','gear','レアドロップの決まり（超レアとは別）',p('通常敵は1体ごとにレア抽選があります。敵の星が5以上は1/5、星4は1/12、星3は1/40、ほかは1/150。抽選に当たると30％でレア装備、70％でレア道具を選びます。敵の強度で第1～3段階が決まります。')+p('ボスの初回撃破ではレア装備を1品、再戦では1/3でレア装備を抽選。レア道具も別に1/2で抽選します。追加装備1000品の抽選や章限定超レアとは別です。')+p('追加装備はショップ・通常敵・ボス・街の装備依頼に分かれています。図鑑や下の装備記事で入手先を確認しましょう。ふつうの共通装備は、職業専用品より性能を控えめにしています。'),'レアドロップ品 隠し要素 星 装備1000種類');
 add('bags','gear','持ち物がいっぱいになったら？',p('道具袋は'+BAG_KINDS+'種類まで、同じ道具は'+BAG_STACK+'個まで。装備品の持ち物は'+EQ_KINDS+'種類まで、同じ装備は最大8個。入りきらない報酬は預かり所へ送られ、預かり所も満杯だと受け取れない場合があります。空きを作ってから挑みましょう。')+p('特別イベント品は別の袋で'+EVENT_ITEM_LIMIT+'種類まで。同じ品は1個。資料→謎解き→準備品の受け渡しというように、使う場所が「特別イベント品」と「事件・謎解き帳」に表示されます。普段の道具袋は圧迫しません。'),'200種類 持ち物分類 預かり所 特別イベント品');
 add('side','special','特別エリア・チャレンジ・サブストーリーの違い',p('地域特別エリアは、各章をクリアすると出る寄り道です。その地域の章の上限近くまで育て、強い装備と技をそろえる高難易度です。本編の次の章へ行くための必須条件ではありません。')+p('特別チャレンジは、敵を倒すだけでなく「決められたターン内」「コメントを何回」などの条件も満たす腕試し。参加料が必要で、オートも使えます。課題は自動達成されないので、必要なら停止して行動を選びましょう。報酬・経験値・熟練度は初回達成だけです。')+p('任意サブストーリーは、クイズや状況判断で解く寄り道です。未解決でも本編を進められます。街の交流祭や撮影会を終えても、本編や別の事件が自動で終わることはありません。本編の準備品が必要な依頼は、事件帳に「本編の準備」と表示されます。準備品を渡した時は、ボスや本番へ挑むための準備が完了した合図です。ここでは問題の答えや物語の内容は載せません。'),'任意 未クリア 解放 隠しエリア サブイベント');
 for(const c of SYSTEM_CHAPTERS.filter(c=>c.special))add('regional-'+c.id,'special',HUBS[c.special].name+'：地域特別エリア',p('解放：'+esc(c.name)+'をクリア。育成目安はLv'+c.cap+'前後＋強い装備＋熟練技。次の章へ進むための必須条件ではありません。ボス戦もオートを使えます。')+p('「特別エリア・未クリア案内」で未達成を確認できます。超レア抽選は'+esc(c.name)+'の3品。まだ出会っていない人物や事件、結末の説明はここに載せません。'),c.special+' 特別エリア '+c.name);
 for(const a of SPECIAL_STAGES)add('stage-'+a.id,'special',(HUBS[a.id]?.name||a.name||a.id)+'：特設エリア',p('入口の条件：九州本編をクリア、解放上限Lv'+a.level+'以上、パーティLv'+Math.max(100,a.level-40)+'以上'+(a.index?'、前の特設エリアのボス撃破':'')+'。ボスと追加チャレンジの腕試しがある育成用エリアです。入口は「特設エリア・Lv999への道」。超レア抽選は'+esc(systemChapterForHub(a.id).name)+'の3品です。')+p('エリアボスもオートを使えます。対応チャレンジは、先にそのエリアのボスを倒し、パーティLv'+(a.level-20)+'以上などの参加条件を満たします。'),a.id+' Lv'+a.level);
 for(const d of POCO_TRIALS)add('trial-'+d.id,'special',d.name+'：チャレンジの条件',p('目安Lv'+d.level+'／参加料'+d.fee+'G。'+esc(trialRequirements(d)))+p('解放は本編依頼'+d.unlock+'の完了'+(d.specialStage!=null?'、該当の特設ボス撃破、上限Lv'+d.level+'以上、パーティLv'+(d.level-20)+'以上':'')+'など。街の安全地帯から挑戦します。戦闘・配信・会話中は始められません。報酬は初回条件達成時のみ。'),d.id+' 特別チャレンジ');
 add('facilities','travel','街の施設：買い物・宿屋・ファミリー・駅',p('ギア店で装備、道具売場で回復品を買えます。宿屋は所持金を払い、控えを含む仲間のHP・MPを回復して翌日に進みます。「日付を進める」だけではHP・MPは回復しません。')+p('ファミリー施設では同行者の入れ替え、仲間の物語、活動予定、装備依頼、倒したボスへの再戦などができます。活動予定では準備費・初回成功報酬・差引額を確認してから開始します。序盤は成功してもGが減る場合があり、失敗時の準備費は戻りません。駅では解放済みの街へ広域交通で移動できます。街の施設の種類や受けられる催しは、街ごとに変わります。'),'ショップ 新幹線 施設 入替');
 add('travel','travel','駅・新幹線の運賃と移動',p('まだ解放していない街には行けません。駅から選ぶと、路線距離が長いほど運賃が上がります。移動には運賃が必要です。金額を確認してから乗車できます。')+p('ゲーム内の路線距離は、街の代表点どうしの直線距離×1.25を切り上げた値。運賃は20＋路線距離です。島などへの移動も含むゲーム独自の広域交通で、現実の運賃や新幹線の駅とは違います。全国地図メニューからの移動には、駅の運賃はかかりません。'),'距離 ゴールド 瞬間移動 日本地図');
 add('stream','start','ライブ配信に不合格だったら？',p('依頼で必要な敵の討伐やボス戦などを終えた後、配信へ進みます。配信中の採点の数字は表示しません。')+p('不合格になると、そのまま連続してやり直せません。表示された再挑戦の条件を確認して、街での会話・戦闘など必要な準備をやり直してから挑みます。選択肢の答えや点数の一覧は、この解説には載せません。'),'不合格 再挑戦 配点 配信失敗');
 add('save','save','セーブとバックアップ：記録を守ろう',p('操作や戦闘の区切りで自動保存します。設定の「保存」の表示を確認してください。公開版の記録は遊んだ人のブラウザに残ります。別のスマホや別のブラウザには自動では移りません。')+p('設定の「バックアップを表示」で文字列を控え、別の端末の「記録の復元」に貼り付けると移せます。ブラウザの閲覧データを消す前に控えましょう。二つのタブで同時に遊ぶと、一方は閲覧だけになります。')+p('2026年10月23日の全ユーザー初期化より前の記録は復元できません。初期化後に始めた現在の記録は、今回の更新でも引き継ぎます。主人公やヒロインを控えにしていた旧編成は、二人が同行する編成へ直します。'),'保存できない セーブできない 復元 リセット');
 add('helpUpdates','save','この解説もゲームと一緒に更新します',p('説明の版は公開版v'+GAME_VERSION+'です。職業・技・装備・章ごとの目安は、実際のゲームデータから記事を作っています。技や装備が増えたら一覧にも反映されます。')+p('新しい仕組みを追加・変更するときは、その使い方、解放条件、数の決まり、注意点をこの解説に追記してから公開します。物語のあらすじ・人物の秘密・結末・クイズの正解は扱いません。'),'アップデート 新機能 更新');
 add('mobileMap','start','スマホの地図：大きく見る・止まる・メニュー',p('MAP上の全国・街へ戻る・拡大縮小ボタンは表示しません。全国地図はメニューから、街の入口へは道しるべから案内できます。ふつうは1マス32pxで表示します。画面がとても狭い時は、入る大きさへ調整します。地面を短くタップすると、その場所へ歩きます。指をずらした時や長く押した時は移動しません。歩いている時に地図をタップすると止まります。')+p('上の街の名前と目的をタップすると、長い目的・保存の状況を全部読めます。「メニュー」から装備・編成・全国地図などを開けます。特別エリアの未クリア件数は、地図の右上から確認できます。'),'スマホ MAP 拡大 縮小 誤操作');

 for(const [id,it]of Object.entries(EQUIP)){const source=guideGearSource(id,it);add('gear-'+id,it.chapterUltra?'rare':'gear',it.name,p(EQ_SLOT_NAME[it.slot]+'／'+(it.job?esc(JOBS[it.job].name)+'専用・熟練度'+it.needR+'以上':'全職業共通')+'／本人Lv'+(it.needL||1)+'以上。')+p(esc(gearStatsText(it))||'追加能力なし。')+p(esc(source))+(it.ultra?p('装備中のみ使用可能：'+esc(it.tech)+'（MP'+it.cost+'／再使用待ち3ターン）。技の名前でも検索できます。'):''),id+' '+(it.job?JOBS[it.job].name:'共有装備 共通装備')+' '+(it.ultra?'超レア':'')+' '+source);}

function systemGuideResults(data={}){const cat=SYSTEM_GUIDE_CATEGORIES[data.cat]?data.cat:'all',q=guideSearchText(data.q||'').slice(0,100),words=q.split(' ').filter(Boolean),items=systemGuideEntries().filter(e=>(cat==='all'||e.cat===cat)&&words.every(w=>e.search.includes(w))),pages=Math.max(1,Math.ceil(items.length/SYSTEM_GUIDE_PAGE_SIZE)),page=Math.max(0,Math.min(pages-1,Math.trunc(Number(data.page)||0)));return {cat,q,items,pages,page,visible:items.slice(page*SYSTEM_GUIDE_PAGE_SIZE,(page+1)*SYSTEM_GUIDE_PAGE_SIZE)};}

/* 画面履歴は表示だけを記録する。セーブ状態や行動結果は巻き戻さない。 */
const SHEET_NAV={frames:[],state:null,context:'',active:null,pending:null,limit:80};
function sheetNavContext(){return [G.screen,G.st?.mapId||'',G.st?.run?.seq||''].join('|');}
function resetSheetNavigation(){SHEET_NAV.frames=[];SHEET_NAV.pending=null;SHEET_NAV.state=G.st;SHEET_NAV.context=sheetNavContext();SHEET_NAV.active=G.sheet;}
function checkSheetNavigation(){if(SHEET_NAV.state!==G.st||SHEET_NAV.context!==sheetNavContext()||SHEET_NAV.active!==G.sheet||!G.sheet&&SHEET_NAV.frames.length)resetSheetNavigation();}
function sheetDataKey(data){const clean=v=>Array.isArray(v)?v.map(clean):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().filter(k=>v[k]!=null&&v[k]!==''&&v[k]!==false&&v[k]!==0&&!['notice','eqKey'].includes(k)&&(k!=='qty'||v.item)).map(k=>[k,clean(v[k])])):v;return JSON.stringify(clean(data||{}));}
function captureSheetFrame(){
 const sh=$('.sheet'),active=document.activeElement,drafts={};
 for(const id of ['systemQuery','helloWorkSearch','renameInput','restoreIn','manageQuery','manageFilter','managePerson']){const el=document.getElementById(id);if(el&&sh?.contains(el))drafts[id]={value:el.value,start:el.selectionStart,end:el.selectionEnd};}
 const focused=active&&sh?.contains(active)?{id:active.id||'',data:{...active.dataset}}:null;
 return {sheet:G.sheet,data:clone(G.sheetData||{}),dlg:G.dlg,scroll:sh?.scrollTop||0,cursor:G.cursorSig,focused,drafts,eqSort:G.eqSort,itSort:G.itSort};
}
function pushSheetFrame(frame){SHEET_NAV.frames.push(frame);if(SHEET_NAV.frames.length>SHEET_NAV.limit)SHEET_NAV.frames.shift();}
function restoreSheetFrame(frame){G.sheet=frame.sheet;G.sheetData=clone(frame.data);G.dlg=frame.dlg;G.cursorSig=frame.cursor;G.eqSort=frame.eqSort;G.itSort=frame.itSort;SHEET_NAV.active=G.sheet;SHEET_NAV.pending=frame;render();}
function restoreSheetPosition(){
 const frame=SHEET_NAV.pending;if(!frame)return;SHEET_NAV.pending=null;
 const sh=$('.sheet');
 for(const [id,d]of Object.entries(frame.drafts)){const el=document.getElementById(id);if(!el||!sh?.contains(el))continue;el.value=d.value;if(Number.isInteger(d.start)&&typeof el.setSelectionRange==='function')try{el.setSelectionRange(d.start,d.end);}catch(e){}}
 let el=frame.focused?.id?document.getElementById(frame.focused.id):null;
 if(!el&&frame.focused&&sh)el=[...sh.querySelectorAll('[data-a]')].find(e=>JSON.stringify({...e.dataset})===JSON.stringify(frame.focused.data));
 if(frame.dlg)el=document.getElementById('dlgNext');
 if(el&&!el.disabled)try{el.focus({preventScroll:true});}catch(e){}
 if(sh)sh.scrollTop=frame.scroll;
}
function findSheetAncestor(k,data,allowParent=false){const key=sheetDataKey(data);for(let i=SHEET_NAV.frames.length-1;i>=0;i--){const f=SHEET_NAV.frames[i];if(f.sheet===k&&(allowParent&&key==='{}'||sheetDataKey(f.data)===key))return i;}return -1;}
function openSystemGuide(){if(G.sheet==='systemGuide')return;openSheet('systemGuide',{cat:'start',q:'',page:0},{suspendDialog:true});}
function openSheet(k,data={},options={}){
 if(k==='regionalGuide'){const pref=data.regionalPref;k='collection';data={ctab:'local',cpref:pref==='KY17'?'大牟田市':REGIONAL_BY_PREF[pref]?.pref||'all'};}
 checkSheetNavigation();
 if(G.sheet===k&&sheetDataKey(G.sheetData)===sheetDataKey(data))return;
 const ancestor=sheetDataKey(data)==='{}'?findSheetAncestor(k,data,true):-1;
 if(ancestor>=0){const frame=SHEET_NAV.frames[ancestor];SHEET_NAV.frames.length=ancestor;restoreSheetFrame(frame);return;}
 pushSheetFrame(captureSheetFrame());G.sheet=k;G.sheetData=clone(data);if(options.suspendDialog)G.dlg=null;G.walk.path=[];SHEET_NAV.active=k;SHEET_NAV.pending=null;G.cursorSig=null;render();const el=$('.sheet');if(el)el.scrollTop=0;
}
function backSheet(fallback=null){checkSheetNavigation();let prev=SHEET_NAV.frames.pop();while(prev&&prev.sheet===G.sheet&&prev.dlg===G.dlg&&sheetDataKey(prev.data)===sheetDataKey(G.sheetData))prev=SHEET_NAV.frames.pop();if(prev){restoreSheetFrame(prev);return;}G.sheet=fallback;G.sheetData={};SHEET_NAV.active=G.sheet;G.cursorSig=null;render();}
function returnToPlay(){
 if(G.sheet==='rename'&&!G.readOnly){finishRename();return;}
 checkSheetNavigation();const origin=SHEET_NAV.frames.find(f=>!f.sheet),dlg=origin?origin.dlg:G.dlg;
 G.sheet=null;G.sheetData={};G.dlg=dlg;G.cursorSig=null;resetSheetNavigation();render();
}
function sheetHasParent(){checkSheetNavigation();return SHEET_NAV.frames.some(f=>f.sheet);}
function closeSheet(){if(G.sheet==='rename'&&!G.readOnly){finishRename();return;}if(['mobileMenu','mobileBattleMenu'].includes(G.sheet)||!sheetHasParent())return returnToPlay();backSheet();}
/* 同じメニュー内の分類・検索・詳細も「1つ前」に含める。購入や転職などの実行は記録しない。 */
function recordSheetAction(name,action){return function(...args){
 checkSheetNavigation();const before=captureSheetFrame(),key=sheetDataKey(before.data),result=action.apply(this,args),d=G.sheetData;
 if(G.sheet&&G.sheet===before.sheet&&key!==sheetDataKey(d)){
  const parent=['itemDropNo','eqDropNo'].includes(name)||name==='itemView'&&!d.item||name==='shopItem'&&!d.item||name==='questDetail'&&!d.questFocus||name==='partyView'&&!d.view&&(!d.cid||d.cid===before.data.cid)||name==='equipView'&&!d.slot&&!d.stock&&(!d.cid||d.cid===before.data.cid)||name==='dexNav'&&!d.detail&&!!before.data.detail;
  const i=parent?findSheetAncestor(G.sheet,d):-1;
  if(i>=0){const frame=SHEET_NAV.frames[i];SHEET_NAV.frames.length=i;restoreSheetFrame(frame);}else{pushSheetFrame(before);const sh=$('.sheet');if(sh&&!['collectionPage','collectionJump','collectionSearch','collectionLocate'].includes(name))sh.scrollTop=0;}
 }
 return result;
};}

 let h=`<button class="btn primary" data-a="openSheet" data-k="storyJournal">本編の準備・任意の事件・謎解き帳</button>${specialReminder(st)}<div class="qsummary"><b>${esc(HUBS[hub].name)}のイベント・依頼</b><p class="small">依頼の受注は同時に1件</p><p>${esc(objective())}</p></div><div class="qfilters">${[['recommended','この街・おすすめ'],['active','進行中'],['all','一覧'],['complete','完了']].map(([v,n])=>`<button class="btn ${filter===v?'primary':''}" aria-pressed="${filter===v}" data-a="questFilter" data-v="${v}">${n}</button>`).join('')}</div>`;

 h+=`<section class="qcard ${state}"><div class="srow"><span class="tag">${q.main?'本編':'任意'}・${labels[state]}</span><span class="small">${esc(HUBS[q.hub].name)}</span></div><button class="btn quest-title" data-a="questDetail" data-v="${id}" aria-expanded="${expanded}"><b>${esc(q.name)}</b><span class="small">${id}　${expanded?'詳細を閉じる':'目的・報酬を見る'}</span></button>${['active','bossReady','combatDone'].includes(state)?`<p class="small">討伐 ${progress}/${q.kills}</p><progress value="${progress}" max="${q.kills}" aria-label="討伐の進行"></progress>`:''}${reason?`<p class="small ${state==='locked'?'dim':'warn'}">${esc(reason)}</p>`:''}${expanded?`<div class="qdetails"><p>${esc(q.goal)}</p><p class="small">完了報酬：経験値${questReward(q).xp}・チケット${questReward(q).tickets}（ボス報酬は別途）</p>${['active','bossReady'].includes(state)?`<button class="btn" data-a="questAbandonPrompt" data-v="${id}">依頼を放棄する…</button>`:''}</div>`:''}${action}</section>`;

function legacyXpFor(L){return 10*(L-1)*(L+6);}
function remapProgress(value,previous,next){
 const old=Math.max(0,Math.min(previous(999),Number.isFinite(value)?value:0));let lo=1,hi=999;
 while(lo<hi){const mid=(lo+hi+1)>>1;if(previous(mid)<=old)lo=mid;else hi=mid-1;}
 if(lo===999)return next(999);
 return next(lo)+Math.floor((old-previous(lo))*(next(lo+1)-next(lo))/(previous(lo+1)-previous(lo)));

/* ===== 操作パネルの位置合わせ：表示枠の下が画面外に出ている分（--vcut）だけ持ち上げる ===== */
const VFIT=(()=>{
  /* 3段構え：①実測（IntersectionObserver） ②iPhoneアプリ枠の推定 ③利用者が一度だけ合わせた値（最優先・端末に永久保存） */
  const KEY="tlr-kyushu-lift", OK="tlr-kyushu-lift-ok";
  let ioCut=0, last=-1, preview=null;
  const inFrame=(()=>{ try{ return window.top!==window.self; }catch(e){ return true; } })();
  const touch=(()=>{ try{ return matchMedia("(pointer:coarse)").matches; }catch(e){ return false; } })();
  function manual(){ try{ const v=localStorage.getItem(KEY); if(v&&v!=="auto"&&!isNaN(+v)) return +v; }catch(e){} return null; }
  function guess(){ /* アプリ内の枠が画面の高さぶん確保され、上のバー分だけ下が隠れるケースを推定 */
    if(!inFrame||!touch) return 0;
    const sw=screen.width||0, sh=screen.height||0; if(!sw||!sh) return 0;
    const portrait=window.innerHeight>=window.innerWidth;
    const H=portrait?Math.max(sw,sh):Math.min(sw,sh);
    return Math.max(0, window.innerHeight-(H-(portrait?100:44))); }
  function autoCut(){ return Math.max(ioCut, guess()); }
  function cur(){ if(preview!=null) return preview; const m=manual(); return m!=null?m:autoCut(); }
  function apply(){ let cut=cur();
    cut=Math.max(0,Math.min(Math.round(cut),Math.round(window.innerHeight*0.4)));
    if(Math.abs(cut-last)<2) return; last=cut; document.documentElement.style.setProperty("--vcut",cut+"px");requestAnimationFrame(()=>{fitEndView();fitBattleView();});
    window.dispatchEvent(new Event("resize")); }
  function calibrate(first){
    if(document.getElementById("vfitCal")) return;
    preview=Math.round(cur()); apply();
    const o=document.createElement("div"); o.id="vfitCal"; o.setAttribute("role","dialog"); o.setAttribute("aria-label","画面の下合わせ");
    o.innerHTML=`<div class="vc-box"><b class="vc-t">${first?"はじめに一度だけ：":""}画面の下合わせ</b>
      <p class="vc-d">画面いちばん下の<span style="color:var(--gold)">黄色い帯</span>が、<b>下の線まで全部</b>見えるように「上へ」「下へ」で合わせて「決定」を押してください。この端末に保存され、次からは自動で使われます。</p>
      <div class="vc-row"><button class="btn" data-v="10">▲ 上へ</button><button class="btn" data-v="-10">▼ 下へ</button></div>
      <p class="vc-n">持ち上げ：<span id="vcNum"></span>px</p>
      <div class="vc-row"><button class="btn" data-k="auto">自動の値に戻す</button><button class="btn primary" data-k="ok">決定</button></div></div>
      <div class="vc-band">▼ この帯の下の線まで見えればOK ▼</div>`;
    document.body.appendChild(o);
    const num=o.querySelector("#vcNum"); const show=()=>{ num.textContent=Math.round(preview); };
    show();
    o.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.v){ preview=Math.max(0,Math.min(Math.round(window.innerHeight*0.4),preview+(+b.dataset.v))); last=-1; apply(); show(); }
      else if(b.dataset.k==="auto"){ preview=Math.round(autoCut()); last=-1; apply(); show(); }
      else if(b.dataset.k==="ok"){ try{ localStorage.setItem(KEY,String(Math.round(preview))); localStorage.setItem(OK,"1"); }catch(e){} preview=null; o.remove(); last=-1; apply(); try{ render(); }catch(e){} try{ toast("画面の下合わせを保存しました。"); }catch(e){} }
    }); }
  try{
    const sd=document.createElement("div"); sd.setAttribute("aria-hidden","true");
    sd.style.cssText="position:fixed;left:0;top:0;bottom:0;width:2px;pointer-events:none;opacity:0;z-index:-1";
    document.body.appendChild(sd);
    if("IntersectionObserver" in window){ const th=[]; for(let i=0;i<=100;i++) th.push(i/100);
      new IntersectionObserver(es=>{ for(const e of es){ if(e.isIntersecting) ioCut=Math.max(0,e.boundingClientRect.bottom-e.intersectionRect.bottom); } apply(); },{threshold:th}).observe(sd); }
  }catch(e){}
  window.addEventListener("orientationchange",()=>setTimeout(()=>{ last=-1; apply(); },300));
  apply();
  /* アプリ内（枠の中）でスマホ表示の時、まだ合わせていなければ初回だけ下合わせを出す */
  let asked=false; try{ asked=!!localStorage.getItem(OK)||manual()!=null; }catch(e){ asked=true; }
  if(inFrame&&touch&&!asked) setTimeout(()=>calibrate(true),700);
  return { apply, calibrate, get mode(){ const m=manual(); return m==null?"auto":String(m); }, get value(){ return Math.round(cur()); } };
})();
