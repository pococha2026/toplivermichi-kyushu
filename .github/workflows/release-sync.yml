name: Game and specification sync
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated release companions and JavaScript syntax
        run: python3 scripts/sync-release.py --check
      - name: Verify synchronization failure cases
        run: python3 scripts/test-release-sync.py
      - name: Verify activity preparation regression cases
        run: node scripts/test-career.cjs
      - name: Verify music, sound effect and mix controls
        run: node scripts/test-av.cjs

      - name: Verify comprehensive data and boundary regressions
        run: node scripts/test-comprehensive.cjs
      - name: Verify transactions and automatic battle actions
        run: node scripts/test-interactions.cjs

      - name: Verify boss rewards, equipment and navigation regressions
        run: node scripts/test-deep-regression.cjs
